<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一個網站</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: linear-gradient(135deg, #fff5f5, #ffe3e3);
      color: #3d2929;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .card {
      width: min(100%, 520px);
      padding: clamp(28px, 8vw, 48px) clamp(20px, 7vw, 36px);
      border: 1px solid #ffe0e0;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(130, 34, 34, 0.12);
      text-align: center;
    }

    .emoji {
      margin: 0 0 12px;
      font-size: 48px;
    }

    h1 {
      margin: 0 0 16px;
      color: #b4232f;
      font-size: clamp(28px, 6vw, 36px);
      text-align: center;
    }

    .intro {
      margin: 0 auto 28px;
      color: #665454;
      font-size: 17px;
      line-height: 1.8;
    }

    button {
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      background: #c62835;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: background 180ms ease, transform 180ms ease;
      touch-action: manipulation;
    }

    button:hover {
      transform: translateY(-2px);
      background: #a91f2b;
    }

    button:focus-visible {
      outline: 3px solid #f3a0a6;
      outline-offset: 4px;
    }

    #greeting {
      min-height: 1.8em;
      margin: 20px 0 0;
      color: #a91f2b;
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="emoji" aria-hidden="true">🌱</p>
    <h1>我的第一個網站</h1>
    <p class="intro">
      你好！我是一位正在學習製作網頁的初學者。
      這是我的第一個網站，歡迎來看看！
    </p>
    <button id="welcome-button" type="button">點我打招呼</button>
    <p id="greeting" aria-live="polite"></p>
  </main>

  <script>
    const welcomeButton = document.querySelector("#welcome-button");
    const greeting = document.querySelector("#greeting");

    welcomeButton.addEventListener("click", function () {
      greeting.textContent = "你好！歡迎來到我的網站！";
    });
  </script>
</body>
</html>
